<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Task Manager</title><script defer="defer" src="main.js"></script></head><body><div class="body"><header>TASK MANAGER</header><div class="container"><section class="projects"><div class="current-project"><div class="header"><p class="name"></p><p class="created"></p></div><div class="footer"><p class="todo-count"></p><button class="edit"></button> <button class="delete"></button></div></div><input class="search projects" placeholder="Search projects..."/><div class="project-list"></div><button class="add-project">New Project</button></section><section class="todos"><div class="filter-bar"><div class="filter-buttons"><button class="filter-button priority low active" data-filter="low">LOW</button> <button class="filter-button priority mid active" data-filter="mid">MID</button> <button class="filter-button priority high active" data-filter="high">HIGH</button> <button class="filter-button status incomplete active" data-filter="incomplete">UNDONE</button> <button class="filter-button status complete active" data-filter="complete">DONE</button></div><input class="search todos" placeholder="Search tasks..."/></div><div class="todo-list"><div class="no-todos"><p>NO TASKS...</p></div></div><div class="footer"><button class="add-todo">Add Task</button> <button class="reset-todos">Reset Tasks</button> <button class="delete-todos">Delete All</button></div></section></div></div><dialog class="project-modal modal"><p class="heading">Add New Project</p><input id="project-name" class="modal-input" placeholder="Enter project name..." maxlength="20"/> <button class="confirm">Confirm</button></dialog><dialog class="delete-project modal"><p>Delete <span class="name"></span> and all its tasks?</p><div class="buttons"><button class="delete">Delete</button> <button class="just-close">Cancel</button></div></dialog><dialog class="todo-modal modal"><p class="heading">Edit Todo</p><input id="todo-title" class="modal-input" placeholder="Enter todo name..." maxlength="30"/> <textarea id="todo-description" class="modal-input" placeholder="Enter todo description..." rows="5" cols="40" maxlength="195"></textarea> <input type="date" id="todo-date" class="modal-input empty"/> <select id="todo-priority" class="modal-input empty"><option value="" selected="selected" disabled="disabled" hidden>Select todo priority</option><option value="low">Low</option><option value="mid">Mid</option><option value="high">High</option></select> <button class="confirm">Confirm</button></dialog><dialog class="move-todo modal"><p class="heading">Move Task</p><select class="project-dropdown modal-input empty"><option value="" selected="selected" disabled="disabled" hidden>Select target project</option></select> <button class="confirm">Confirm</button></dialog><dialog class="clear-todos modal"><p>Delete all tasks in <span class="name"></span>?</p><div class="buttons"><button class="delete">Delete</button> <button class="just-close">Cancel</button></div></dialog><dialog class="other modal"><p class="other-message"></p><button class="just-close">Ok</button></dialog></body></html>
