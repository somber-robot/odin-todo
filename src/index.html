<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>TODO</header>
    <div class="container">
        <section class="projects">
            <div class="project-tab">
                <div class="current-project">
                    <p class="name">Default Project</p>
                    <p class="created">08/29/2026</p>
                    <p class="summary">A simple project to get you started. Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quas, natus id aut sed vel molestias debitis neque quidem.</p>
                    <div class="footer">
                        <p class="todo-count">2 tasks</p>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </div>
                </div>
                <input type="text" class="search projects" placeholder="Search projects...">
                <div class="project-list"></div>
            </div>
            <button class="add-project">Add Project</button>
        </section>
        <section class="todos">
            <div class="filter-bar">
                <div class="filter-buttons">
                    <button class="filter-button priority low active">Low</button>
                    <button class="filter-button priority mid active">Mid</button>
                    <button class="filter-button priority high active">High</button>
                    <button class="filter-button status incomplete active">Not Done</button>
                    <button class="filter-button status complete active">Done</button>
                </div>
                <input type="text" class="search todos" placeholder="Search todos...">
            </div>
            <div class="todo-list"></div>
            <div class="footer">
                <button class="add-todo">Add Todo</button>
                <button class="reset-todos">Reset Todos</button>
                <button class="clear-todos">Delete All</button>
            </div>
        </section>
    </div>
    <dialog class="project-modal modal">
        <p class="heading">Add New Project</p>
        <label for="project-name" class="modal-label">Name
            <input type="text" id="project-name" class="modal-input"  placeholder="Enter project name...">
        </label>
        <label for="project-summary" class="modal-label">Description
            <input type="text" id="project-summary" class="modal-input"  placeholder="Enter project description...">
        </label>
        <button class="confirm">Confirm</button>
    </dialog>
    <dialog class="todo-modal modal">
        <p class="heading">Edit Todo</p>
        <label for="todo-title"class="modal-label">Title
            <input type="text" id="todo-title" class="modal-input" placeholder="Enter todo name...">
        </label>
        <label for="todo-description" class="modal-label">Description
            <input type="text" id="todo-description" class="modal-input" placeholder="Enter todo description...">
        </label>
        <label for="todo-date" class="modal-label">Due Date
            <input type="date" id="todo-date" class="modal-input">
        </label>
        <label for="todo-priority" class="modal-label">Priority
            <select id="todo-priority" class="modal-input">
                <option value="" selected disabled hidden></option>
                <option value="low">Low</option>
                <option value="mid">Mid</option>
                <option value="high">High</option>
            </select>
        </label>
        <button class="confirm">Confirm</button>
    </dialog>
    <dialog class="move-todo modal">
        <p>Move</p>
        <p class="todo-title"></p>
        <p>From</p>
        <p class="project-name"></p>
        <p>To</p>
        <select class="project-dropdown modal-input">
            <option value="" selected disabled hidden></option>
        </select>
        <button class="confirm">Confirm</button>
    </dialog>
    <dialog class="other modal">
        <p class="other-message"></p>
        <button>Ok</button>
    </dialog>
</body>
</html>
